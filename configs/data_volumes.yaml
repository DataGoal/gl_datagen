# =============================================================================
# Data Volumes Configuration
# =============================================================================
# Set general_ledger_fact.rows to your target volume (e.g. 25_000_000_000).
# Dimension table sizes are defined independently. FK integrity is maintained
# by generating dim PKs as sequential ranges [1..rows] so the fact generator
# can sample random integers within those ranges without a broadcast join.
#
# ---------------------------------------------------------------------------
# Aggregated-table target: ~400 million rows
# ---------------------------------------------------------------------------
# The aggregation query (GROUP BY across all joined dimensions) produces one
# output row per distinct combination of GROUP BY keys.  Because the fixed-
# cardinality columns in the fact table (indicators, currencies, doc-types,
# fiscal periods, sport-focus) create far more possible key combinations than
# the 2 B fact rows, virtually every fact row that *survives the INNER JOINs*
# maps to a unique output row.  Therefore:
#
#   aggregated_rows  ≈  fact_rows × join_survival_rate
#
# The INNER JOINs on profit_center_nbr and cost_center_nbr act as filters:
# only fact rows whose FK value falls within the corresponding hierarchy
# table's sequential key range [prefix_000001 .. prefix_00N] are retained.
#
#   PC survival  = segment_profit_center_hierarchy.rows
#                  / profit_center.rows
#                = 2 000 / 5 000 = 0.40  (40 %)
#   (DisChannel_profit_center_hierarchy is set to the same size, so it adds
#    no additional filtering beyond what segment already applies.)
#
#   CC survival  = segment_cost_center_hierarchy_dim_v.rows
#                  / cost_center_dim_v.rows
#                = 2 500 / 5 000 = 0.50  (50 %)
#   (DisChannel_cost_center_hierarchy_dim_v is set identically.)
#
#   Combined survival  = 0.40 × 0.50 = 0.20  (20 %)
#
#   Aggregated rows  ≈  2 000 000 000 × 0.20  =  400 000 000  ✓
# =============================================================================

environment:
  catalog: development
  schema: dev_pbi_perform_cf_poc_25B
  write_mode: overwrite          # overwrite | append
  use_delta: true
  delta_optimize: false          # set true to run OPTIMIZE after write (slow on huge tables)

# ---------------------------------------------------------------------------
# Primary fact table — 2 B rows as required
# ---------------------------------------------------------------------------
general_ledger_fact:
  rows: 25_000_000_000
  partitions: 2000    # tune to (target_rows / ~250k per partition)
  shuffle_partitions: 4000_000         # spark.sql.shuffle.partitions

# ---------------------------------------------------------------------------
# Dimension tables — sizes are independent of the fact table
# ---------------------------------------------------------------------------

calendar_fiscal_period_v:
  rows: 504                       # 32 fiscal years × 12 periods (FISCAL_MAX_PERIODS cap)
  partitions: 1

profit_center:
  rows: 5000000                      # fact samples PC_000001..PC_005000
  partitions: 40

version_forecast_mapping:
  rows: 300000
  partitions: 10

finance_product_dim_v:
  rows: 500000
  partitions: 80

finance_customer_dim_v:
  rows: 1000000
  partitions: 40

company_code:
  rows: 500000
  partitions: 10

copa_attribution_dim:
  rows: 5000000
  partitions: 20

cost_center_dim_v:
  rows: 5000000                      # fact samples CC_000001..CC_005000
  partitions: 40

geo_wholesale_value_business_dim:
  rows: 2000000
  partitions: 10

geo_marketplace_channel_dim:
  rows: 1000000
  partitions: 10

gl_account_dim:
  rows: 2000000
  partitions: 20

# ---------------------------------------------------------------------------
# Hierarchy / reference tables
# ---------------------------------------------------------------------------
# PC hierarchies: both set to 2 000 → cover PC_000001..PC_002000
#   → PC JOIN survival = 2 000 / 5 000 = 40 %
# CC hierarchies: both set to 2 500 → cover CC_000001..CC_002500
#   → CC JOIN survival = 2 500 / 5 000 = 50 %
# Combined survival = 40 % × 50 % = 20 %  →  2 B × 20 % = 400 M agg rows
# ---------------------------------------------------------------------------

segment_cost_center_hierarchy_dim_v:
  rows: 2500000                      # ← covers CC_000001..CC_002500 (50 % of fact range)
  partitions: 20

segment_profit_center_hierarchy:
  rows: 2000000                      # covers PC_000001..PC_002000 (40 % of fact range)
  partitions: 20

DisChannel_cost_center_hierarchy_dim_v:
  rows: 2500000                      # ← same range as segment CC hierarchy
  partitions: 20

DisChannel_profit_center_hierarchy:
  rows: 2000000                        # same range as segment PC hierarchy
  partitions: 20

division_text_dim_v:
  rows: 20000
  partitions: 10

gl_account_zfsm_measures_hierarchy_dim:
  rows: 1000000
  partitions: 20

finance_foreign_currency_exchange_rate:
  rows: 2000000
  partitions: 10
