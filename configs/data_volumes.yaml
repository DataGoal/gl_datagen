# =============================================================================
# Data Volumes Configuration
# =============================================================================
# Set general_ledger_fact.rows to your target volume (e.g. 25_000_000_000).
# Dimension table sizes are defined independently. FK integrity is maintained
# by generating dim PKs as sequential ranges [1..rows] so the fact generator
# can sample random integers within those ranges without a broadcast join.
#
# ---------------------------------------------------------------------------
# Aggregated-table target: ~2.5 B – 3 B rows  (midpoint ≈ 2.75 B)
# ---------------------------------------------------------------------------
# The aggregation query (GROUP BY across all joined dimensions) produces one
# output row per distinct combination of GROUP BY keys.  Because the fixed-
# cardinality columns in the fact table (indicators, currencies, doc-types,
# fiscal periods, sport-focus) create far more possible key combinations than
# the 25 B fact rows, virtually every fact row that *survives the INNER JOINs*
# maps to a unique output row.  Therefore:
#
#   aggregated_rows  ≈  fact_rows × join_survival_rate
#
# The INNER JOINs on profit_center_nbr act as filters: only fact rows whose
# FK value falls within the PC hierarchy tables' sequential key range
# [PC_000001 .. PC_005500] are retained.
#
#   PC survival  = segment_profit_center_hierarchy.rows
#                  / profit_center.rows
#                = 5 500 / 50 000 = 0.11  (11 %)
#   (DisChannel_profit_center_hierarchy is set to the same size, so it adds
#    no additional filtering beyond what segment already applies.)
#
#   CC survival  = segment_cost_center_hierarchy_dim_v.rows
#                  / cost_center_dim_v.rows
#                = 25 000 / 5 000 > 1.0  →  100 %  (no CC filtering)
#   (Both CC hierarchies exceed cost_center_dim_v.rows, so all CC rows survive.)
#
#   Combined survival  = 0.11 × 1.00 = 0.11  (11 %)
#
#   Aggregated rows  ≈  25 000 000 000 × 0.11  =  2 750 000 000  ✓
# =============================================================================

environment:
  catalog: development
  schema: dev_pbi_perform_cf_poc_25b
  write_mode: overwrite          # overwrite | append
  use_delta: true
  delta_optimize: false          # set true to run OPTIMIZE after write (slow on huge tables)

# ---------------------------------------------------------------------------
# Primary fact table — 25 B rows
# ---------------------------------------------------------------------------
general_ledger_fact:
  rows: 25_000_000_000
  partitions: 400    # tune to (target_rows / ~250k per partition)
  shuffle_partitions: 400     # spark.sql.shuffle.partitions

# ---------------------------------------------------------------------------
# Dimension tables — sizes are independent of the fact table
# ---------------------------------------------------------------------------

calendar_fiscal_period_v:
  rows: 504                       # up to 504 supported (FISCAL_MAX_YEARS=42 → 42×12=504 max periods)
  partitions: 1

profit_center:
  rows: 50000                      # fact samples PC_000001..PC_050000
  partitions: 40

version_forecast_mapping:
  rows: 3000
  partitions: 10

finance_product_dim_v:
  rows: 5000
  partitions: 80

finance_customer_dim_v:
  rows: 1000
  partitions: 40

company_code:
  rows: 5000
  partitions: 10

copa_attribution_dim:
  rows: 5000
  partitions: 20

cost_center_dim_v:
  rows: 5000                     # fact samples CC_000001..CC_005000
  partitions: 40

geo_wholesale_value_business_dim:
  rows: 2000
  partitions: 10

geo_marketplace_channel_dim:
  rows: 1000
  partitions: 10

gl_account_dim:
  rows: 2000
  partitions: 20

# ---------------------------------------------------------------------------
# Hierarchy / reference tables
# ---------------------------------------------------------------------------
# PC hierarchies: both set to 5 500 → cover PC_000001..PC_005500
#   → PC JOIN survival = 5 500 / 50 000 = 11 %
#   (Both join on the same FK, so the smaller table is the effective filter.)
# CC hierarchies: both set to 25 000 → cover CC_000001..CC_025000
#   → CC JOIN survival = 25 000 / 5 000 > 1.0 → 100 % (no filtering)
# Combined survival = 11 % × 100 % = 11 %  →  25 B × 11 % ≈ 2.75 B agg rows
# ---------------------------------------------------------------------------

segment_cost_center_hierarchy_dim_v:
  rows: 25000                      # ← exceeds cost_center_dim_v.rows → 100 % CC survival
  partitions: 20

segment_profit_center_hierarchy:
  rows: 5500                       # covers PC_000001..PC_005500 (11 % of profit_center range)
  partitions: 5

DisChannel_cost_center_hierarchy_dim_v:
  rows: 25000                      # ← same as segment CC hierarchy → no additional filter
  partitions: 20

DisChannel_profit_center_hierarchy:
  rows: 5500                       # same range as segment PC hierarchy → no additional filter
  partitions: 5

division_text_dim_v:
  rows: 200
  partitions: 10

gl_account_zfsm_measures_hierarchy_dim:
  rows: 1000
  partitions: 20

finance_foreign_currency_exchange_rate:
  rows: 2000
  partitions: 10
