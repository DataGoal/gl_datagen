# =============================================================================
# Data Volumes Configuration
# =============================================================================
# Set general_ledger_fact.rows to your target volume (e.g. 25_000_000_000).
# Dimension table sizes are defined independently. FK integrity is maintained
# by generating dim PKs as sequential ranges [1..rows] so the fact generator
# can sample random integers within those ranges without a broadcast join.
# =============================================================================

environment:
  catalog: development
  schema: dev_pbi_perform_cf_poc_2B_agg
  write_mode: overwrite          # overwrite | append
  use_delta: true
  delta_optimize: false          # set true to run OPTIMIZE after write (slow on huge tables)

# ---------------------------------------------------------------------------
# Primary fact table — this is the anchor for all scale-out tests
# ---------------------------------------------------------------------------
general_ledger_fact:
  rows: 2_000_000_000             # ← change to 25_000_000_000 for 25B rows
  partitions: 2000                # tune to (target_rows / ~250k per partition)
  shuffle_partitions: 400        # spark.sql.shuffle.partitions

# ---------------------------------------------------------------------------
# Dimension tables — sizes are independent of the fact table
# ---------------------------------------------------------------------------
accounting_document_type:
  rows: 5000
  partitions: 1

calendar_fiscal_period_v:
  rows: 3000                      # ~25 fiscal years × 12 periods
  partitions: 1

profit_center:
  rows: 5000
  partitions: 4

division_text:
  rows: 20                        # hardcoded list of 20 divisions; cap enforced in orchestrator
  partitions: 1

version_forecast_mapping:
  rows: 300
  partitions: 1

functional_area:
  rows: 1000
  partitions: 1

finance_product_dim_v:
  rows: 5000
  partitions: 8

finance_customer_dim_v:
  rows: 1000
  partitions: 4

